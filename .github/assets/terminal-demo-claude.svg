<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-label="Animated terminal demo: installing LLM Council into a Claude project with scripts/install.ps1, then running /council, where the Chairman convenes three specialists and returns a verdict">
<style>
text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:#e6edf3;white-space:pre}
.p{fill:#d2a8ff;font-weight:700}.ok{fill:#3fb950}.d{fill:#8b949e}.a{fill:#79c0ff}
.line{opacity:0;animation:16s linear infinite}
#l1{animation-name:l1}#l2{animation-name:l2}#l3{animation-name:l3}#l4{animation-name:l4}#l5{animation-name:l5}#l6{animation-name:l6}#l7{animation-name:l7}#l8{animation-name:l8}#l9{animation-name:l9}
@keyframes l1{0%,2%{opacity:0}2.1%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l2{0%,27%{opacity:0}27.1%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l3{0%,31%{opacity:0}31.1%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l4{0%,51%{opacity:0}51.1%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l5{0%,53.5%{opacity:0}53.6%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l6{0%,56%{opacity:0}56.1%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l7{0%,58.5%{opacity:0}58.6%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l8{0%,61%{opacity:0}61.1%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes l9{0%,64%{opacity:0}64.1%,94%{opacity:1}98%,100%{opacity:0}}
#c1{animation:c1 16s steps(50,end) infinite}
#c2{animation:c2 16s steps(38,end) infinite}
@keyframes c1{0%,4%{transform:translateX(0)}24%,100%{transform:translateX(450px)}}
@keyframes c2{0%,33%{transform:translateX(0)}48%,100%{transform:translateX(342px)}}
.caret{animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<clipPath id="w"><rect width="760" height="310" rx="10"/></clipPath>
<g clip-path="url(#w)">
<rect width="760" height="310" fill="#0d1117"/>
<rect width="760" height="36" fill="#161b22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="380" y="23" text-anchor="middle" class="d">llm-council · claude</text>
<g class="line" id="l1"><text x="20" y="70" class="p">❯</text><text x="38" y="70" textLength="450">scripts/install.ps1 -Provider <tspan class="a">claude</tspan> -TargetPath <tspan class="a">.</tspan></text><rect id="c1" x="38" y="55" width="450" height="20" fill="#0d1117"/></g>
<g class="line" id="l2"><text x="20" y="94"><tspan class="ok">✔︎</tspan> Installed LLM Council Claude adapter into <tspan class="a">.claude/</tspan></text></g>
<g class="line" id="l3"><text x="20" y="130" class="p">❯</text><text x="38" y="130" textLength="342">/council <tspan class="a">Rewrite the monolith in Rust?</tspan></text><rect id="c2" x="38" y="115" width="342" height="20" fill="#0d1117"/></g>
<g class="line" id="l4"><text x="20" y="154" class="d">Chairman convened 3 specialists  (role · persona · soul)</text></g>
<g class="line" id="l5"><text x="20" y="178"><tspan class="d">├─</tspan> engineer        <tspan class="d">· pragmatic · gladiator</tspan></text></g>
<g class="line" id="l6"><text x="20" y="202"><tspan class="d">├─</tspan> economist       <tspan class="d">· skeptical · dry-wit</tspan></text></g>
<g class="line" id="l7"><text x="20" y="226"><tspan class="d">├─</tspan> security-expert <tspan class="d">· paranoid  · sage</tspan></text></g>
<g class="line" id="l8"><text x="20" y="250"><tspan class="d">└─</tspan> <tspan class="ok">✔︎</tspan> Verdict ready, judge not needed</text></g>
<g class="line" id="l9"><text x="20" y="286" class="p">❯</text><rect class="caret" x="38" y="273" width="9" height="17" fill="#e6edf3"/></g>
</g>
</svg>
